name = "spider-notebook"
compatibility_date = "2026-01-29"
pages_build_output_dir = "dist"

# Spider Search index.
#
# This project manages bindings through wrangler.toml (the dashboard Add
# Binding UI is disabled), so the D1 binding must live here.
# database_id must be a real UUID - a placeholder fails every build with:
#   Error 8000022: Invalid database UUID
[[d1_databases]]
binding = "DB"
database_name = "spidersearch"
database_id = "4c12ed02-ae20-4e2c-a580-0734ad60be3b"
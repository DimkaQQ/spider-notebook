name = "spider-notebook"
compatibility_date = "2026-01-29"
pages_build_output_dir = "dist"

# Spider Search index.
#
# The D1 binding is configured in the Cloudflare dashboard
# (Settings -> Functions -> Bindings -> Add -> D1 database).
# Do NOT add a [[d1_databases]] block here unless database_id is a real UUID -
# a placeholder makes every Pages build fail with:
#   Error 8000022: Invalid database UUID
#
# [[d1_databases]]
# binding = "DB"
# database_name = "spidersearch"
# database_id = "00000000-0000-0000-0000-000000000000"